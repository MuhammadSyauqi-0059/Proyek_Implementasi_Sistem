<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Kopi Lokal Pekalongan</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <h1>☕ Peta Kopi Lokal Pekalongan</h1>
            <p class="subtitle">Temukan petani dan UMKM kopi di sekitar Anda</p>
        </div>
    </header>

    <!-- STATISTIK -->
    <section class="stats">
        <div class="container stats-grid">
            <div class="stat-card">
                <span class="stat-number" id="stat-petani">-</span>
                <span class="stat-label">Petani</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-umkm">-</span>
                <span class="stat-label">UMKM</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-produk">-</span>
                <span class="stat-label">Produk</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-kecamatan">-</span>
                <span class="stat-label">Kecamatan</span>
            </div>
        </div>
    </section>

    <!-- FILTER -->
    <section class="filters">
        <div class="container filter-grid">
            <input type="text" id="search-input" placeholder="Cari nama petani/UMKM..." />

            <select id="filter-district">
                <option value="">Semua Kecamatan</option>
            </select>

            <select id="filter-type">
                <option value="">Semua Tipe</option>
                <option value="petani">Petani</option>
                <option value="umkm">UMKM</option>
            </select>

            <button id="btn-reset">Reset</button>
        </div>
    </section>

    <!-- MAP -->
    <section class="map-section">
        <div id="map"></div>
    </section>

    <!-- LIST PRODUCERS -->
    <section class="producers-list">
        <div class="container">
            <h2>Daftar Petani & UMKM Kopi</h2>
            <div id="producers-container" class="producers-grid"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Peta Kopi Lokal Pekalongan | Skripsi Informatika</p>
        </div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/map.js"></script>

</body>
</html>
